name: Verified CMS source import
on:
  push:
    branches: [import/brendy-cms-2.42.29]
    paths: ['.github/workflows/import-cms.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: brendy-source-import
  cancel-in-progress: false
jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: import/brendy-cms-2.42.29
      - name: Verify and import source
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, stat, zipfile
          root = pathlib.Path.cwd()
          archive = root / 'Brendy-CMS-2.42.28.zip'
          if hashlib.sha256(archive.read_bytes()).hexdigest() != '0971775665e2baa1ed9b6758b6cefb564a9875b3eb154b5aeac42a057ac69a1f':
              raise SystemExit('Unexpected archive digest')
          prefix = 'Brendy-CMS-2.42.28/'
          with zipfile.ZipFile(archive) as z:
              if z.testzip() is not None:
                  raise SystemExit('Invalid ZIP')
              entries = {}
              for info in z.infolist():
                  if info.is_dir():
                      continue
                  name = info.filename
                  if not name.startswith(prefix):
                      raise SystemExit('Unexpected archive root')
                  name = name[len(prefix):]
                  p = pathlib.PurePosixPath(name)
                  if not name or p.is_absolute() or '..' in p.parts or '\\' in name or any(part.lower() == '.git' for part in p.parts) or name in entries or stat.S_ISLNK(info.external_attr >> 16):
                      raise SystemExit('Unsafe archive member')
                  entries[name] = z.read(info)
              if len(entries) != 547:
                  raise SystemExit('Unexpected member count')
          expected = {}
          for line in entries['SHA256SUMS.txt'].decode().splitlines():
              digest, name = line.split('  ', 1)
              if name in expected:
                  raise SystemExit('Duplicate manifest entry')
              expected[name] = digest
          if set(expected) != set(entries) - {'SHA256SUMS.txt'} or any(hashlib.sha256(entries[name]).hexdigest() != digest for name, digest in expected.items()):
              raise SystemExit('Manifest mismatch')
          secret = json.loads(entries['sadrzaj/.tinymce-cloud.json'])['apiKey'].encode()
          if not secret:
              raise SystemExit('Unexpected credential format')
          exported = {}
          for name, data in entries.items():
              if name == 'SHA256SUMS.txt' or name.startswith('tests/reports/') or (name.startswith('sadrzaj/') and name != 'sadrzaj/.keep'):
                  continue
              if secret in data:
                  raise SystemExit('Credential detected in source')
              if name == 'README.md':
                  name = 'docs/USER-GUIDE-2.42.28.md'
              if (root / name).exists():
                  raise SystemExit('Refusing to overwrite existing file: ' + name)
              exported[name] = data
          for name, data in exported.items():
              path = root / name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          for name in ['index.php','install.php','jezgra/release.php','sadrzaj/.keep']:
              if not (root / name).is_file():
                  raise SystemExit('Missing essential source: ' + name)
          readme = root / 'README.md'
          readme.write_text(readme.read_text().replace('Brendy CMS 2.42.29','Brendy CMS 2.42.28'), encoding='utf-8')
          archive.unlink()
          print(f'Imported {len(exported)} verified files; retained existing branding and licensing. Private configuration and historical reports excluded.')
          PY
          git add -A
          git add -f sadrzaj/.keep
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Import verified Brendy CMS 2.42.28 source and remove ZIP"
          git push origin HEAD:import/brendy-cms-2.42.29
